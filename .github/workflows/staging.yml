name: Deploy to Staging Environment

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # Manual trigger button

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: |
          cd backend
          npm install

      - name: Run API Tests
        run: |
          # Wait for server to be ready
          sleep 10
      
          # Test 1: Health check - GET /api/todos should return 200
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.TESTING_HOST }}/api/todos)
          if [ "$STATUS" != "200" ]; then
            echo "❌ GET /api/todos failed with status $STATUS"
            exit 1
          fi
          echo "✅ GET /api/todos passed"
      
          # Test 2: POST /api/todos should create a todo
          RESPONSE=$(curl -s -X POST http://${{ secrets.TESTING_HOST }}/api/todos \
            -H "Content-Type: application/json" \
            -d '{"title":"CI Test Todo"}')
          echo "$RESPONSE" | grep -q "CI Test Todo"
          if [ $? -ne 0 ]; then
            echo "❌ POST /api/todos failed"
            exit 1
          fi
          echo "✅ POST /api/todos passed"
      
          echo "All tests passed ✅"

      - name: Run ESLint
        run: |
          cd backend
          npm run lint

      - name: Build React Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Deploy to Staging Server
        if: success()
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /var/www/todo-app || git clone https://github.com/${{ github.repository }} /var/www/todo-app
            cd /var/www/todo-app
            git fetch origin
            git checkout main
            git pull origin main

            # Backend
            cd backend
            npm install
            cat > .env << EOF
            DB_HOST=${{ secrets.DB_HOST }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASS=${{ secrets.DB_PASS }}
            DB_NAME=${{ secrets.DB_NAME }}
            PORT=5000
            EOF
            pm2 restart todo-backend || pm2 start server.js --name todo-backend

            # Frontend
            cd ../frontend
            npm install
            npm run build
            sudo cp -r build/* /var/www/todo-frontend/

      - name: Send Success Email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅ Staging Deployment Successful - ${{ github.sha }}"
          to: ${{ secrets.INSTRUCTOR_EMAIL }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            Changes have been successfully deployed to the Staging environment.

            Access the app at: http://${{ secrets.STAGING_HOST }}
            Commit: ${{ github.sha }}
            By: ${{ github.actor }}

      - name: Send Failure Email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ Staging Workflow Failed"
          to: ${{ secrets.INSTRUCTOR_EMAIL }},${{ github.actor }}@gmail.com
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            The staging workflow has FAILED.

            Commit: ${{ github.sha }}
            By: ${{ github.actor }}
            Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
